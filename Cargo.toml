[package]
name = "claude-account-swapper"
version = "0.3.0"
edition = "2024"
default-run = "claude-account"
rust-version = "1.88"
description = "Save and switch Claude Code accounts without repeated browser logins"
license = "MIT"
repository = "https://github.com/EarlySalty/Claude-Account-Swapper"

[[bin]]
name = "claude-account"
path = "src/main.rs"

[[bin]]
name = "claude-account-t3"
path = "src/t3_main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "3.1", default-features = false, features = ["rustls", "json"] }
wait-timeout = "0.2.1"
tiny_http = "0.12"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"
