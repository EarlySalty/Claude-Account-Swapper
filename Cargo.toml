[package]
name = "claude-account-swapper"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Save and switch Claude Code accounts without repeated browser logins"
license = "MIT"
repository = "https://github.com/EarlySalty/Claude-Account-Swapper"

[[bin]]
name = "claude-account"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"
